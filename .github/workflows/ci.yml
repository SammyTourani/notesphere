name: CI

# Runs on a clean checkout with no secrets: install, production build, and the
# pure-logic unit suite. Browser/e2e/Firebase paths are intentionally excluded
# so this workflow stays deterministic and green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run
